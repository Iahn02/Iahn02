<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Inter:wght@400;700;900&amp;display=swap');
      
      .bg { fill: #F7EBE1; }
      .text-primary { fill: #E02138; }
      .text-dark { fill: #0D1117; }
      .text-gray { fill: #8B949E; }
      
      .font-mono { font-family: 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 14px; font-weight: 600;}
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; }
      
      .box {
        fill: #F7EBE1;
        stroke: #0D1117;
        stroke-width: 3;
      }
      .box-shadow {
        fill: #0D1117;
      }
      .icon {
        fill: transparent;
        stroke: #0D1117;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .title {
        font-size: 40px;
        fill: #0D1117;
      }
    </style>
  </defs>

  <rect width="800" height="480" class="bg" />

  <!-- Title -->
  <text x="40" y="60" class="font-sans text-primary title" font-size="46">// tech_stack</text>
  <rect x="40" y="80" width="3" height="300" fill="#E02138" />

  <g transform="translate(60, 90)">
    
    <!-- Box 1: Node.js -->
    <rect x="50" y="15" width="160" height="80" class="box-shadow" />
    <rect x="46" y="11" width="160" height="80" class="box" />
    <text x="126" y="55" class="font-mono text-dark" text-anchor="middle">NODE.JS</text>
    <text x="126" y="75" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 2: TypeScript -->
    <rect x="230" y="15" width="110" height="80" class="box-shadow" />
    <rect x="226" y="11" width="110" height="80" class="box" />
    <text x="281" y="55" class="font-mono text-dark" text-anchor="middle">TYPESCRIPT</text>
    <text x="281" y="75" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 3: JavaScript -->
    <rect x="360" y="15" width="110" height="80" class="box-shadow" />
    <rect x="356" y="11" width="110" height="80" class="box" />
    <text x="411" y="55" class="font-mono text-dark" text-anchor="middle">JAVASCRIPT</text>
    <text x="411" y="75" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 4: SQL / PostgreSQL -->
    <rect x="490" y="15" width="220" height="80" class="box-shadow" />
    <rect x="486" y="11" width="220" height="80" class="box" />
    <text x="596" y="55" class="font-mono text-dark" text-anchor="middle">SQL / POSTGRES</text>
    <text x="596" y="75" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Row 2 -->
    <!-- Box 5: React -->
    <rect x="50" y="115" width="160" height="80" class="box-shadow" />
    <rect x="46" y="111" width="160" height="80" class="box" />
    <text x="126" y="155" class="font-mono text-dark" text-anchor="middle">REACT</text>
    <text x="126" y="175" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 6: .NET -->
    <rect x="230" y="115" width="240" height="80" class="box-shadow" />
    <rect x="226" y="111" width="240" height="80" class="box" />
    <text x="346" y="155" class="font-mono text-dark" text-anchor="middle">C# / .NET</text>
    <text x="346" y="175" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 7: Angular -->
    <rect x="490" y="115" width="220" height="80" class="box-shadow" />
    <rect x="486" y="111" width="220" height="80" class="box" />
    <text x="596" y="155" class="font-mono text-dark" text-anchor="middle">ANGULAR</text>
    <text x="596" y="175" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Row 3 -->
    <!-- Box 8: APIS REST -->
    <rect x="50" y="215" width="160" height="80" class="box-shadow" />
    <rect x="46" y="211" width="160" height="80" class="box" />
    <text x="126" y="255" class="font-mono text-dark" text-anchor="middle">APIS REST</text>
    <text x="126" y="275" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 9: CLOUD -->
    <rect x="230" y="215" width="240" height="80" class="box-shadow" />
    <rect x="226" y="211" width="240" height="80" class="box" />
    <text x="346" y="255" class="font-mono text-dark" text-anchor="middle">AZURE &amp; GCP</text>
    <text x="346" y="275" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

    <!-- Box 10: GIT / GITHUB -->
    <rect x="490" y="215" width="220" height="80" class="box-shadow" />
    <rect x="486" y="211" width="220" height="80" class="box" />
    <text x="596" y="255" class="font-mono text-dark" text-anchor="middle">GIT / GITHUB</text>
    <text x="596" y="275" class="font-mono text-dark" text-anchor="middle">-&gt;</text>

  </g>
</svg>
